name: Markdown Links

# Fails a PR that adds or changes a broken *relative* link or anchor in markdown.
# External URLs are covered by the lychee job in docs.yml.

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check-markdown-links.mjs'
      - '.github/workflows/markdown-links.yml'

permissions:
  contents: read

jobs:
  relative-links:
    name: Check relative markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit-test the link checker
        run: node --test scripts/check-markdown-links.test.mjs

      - name: Check links in changed markdown files
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.md')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No markdown files changed."
            exit 0
          fi
          node scripts/check-markdown-links.mjs "${files[@]}"
