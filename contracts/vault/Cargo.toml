[package]
name = "vault"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Mirrors the soroban-sdk convention. Exposes test-only contract types (such as
# `benji_strategy`) so integration tests under `tests/` can register a strategy
# contract; it is never enabled for a WASM build.
testutils = []

[dependencies]
soroban-sdk = { workspace = true }
share-price-math = { path = "../share-price-math" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
mock-strategy = { path = "../mock-strategy" }
proptest = { version = "1", default-features = false, features = ["std"] }
vault = { path = ".", features = ["testutils"] }
