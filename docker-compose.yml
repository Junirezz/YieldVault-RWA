services:
  postgres:
    image: postgres:15-alpine
    container_name: yieldvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yieldvault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yieldvault || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env.example
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/yieldvault
      REDIS_URL: ""
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    env_file:
      - frontend/.env.example
    environment:
      VITE_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
