[workspace]
resolver = "2"
members = [
    "contracts/vault",
    "contracts/mock-strategy",
    "contracts/share-price-math",
    "contracts/bridge-compat",
]

[workspace.dependencies]
soroban-sdk = "22.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
incremental = false

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
