groups:
  - name: yieldvault-backend-slos
    interval: 30s
    rules:
      - alert: YieldVaultHealthLatencyHigh
        expr: histogram_quantile(0.95, sum by (route, method, le) (rate(http_response_time_seconds_bucket{route="/health"}[5m]))) > 0.05
        for: 5m
        labels:
          severity: warning
          service: yieldvault-backend
        annotations:
          summary: "YieldVault health endpoint latency budget exceeded"
          description: "The /health P95 latency is above its 50ms budget."

      - alert: YieldVaultReadinessLatencyHigh
        expr: histogram_quantile(0.95, sum by (route, method, le) (rate(http_response_time_seconds_bucket{route="/ready"}[5m]))) > 0.1
        for: 5m
        labels:
          severity: warning
          service: yieldvault-backend
        annotations:
          summary: "YieldVault readiness latency budget exceeded"
          description: "The /ready P95 latency is above its 100ms budget."

      - alert: YieldVaultCriticalReadLatencyHigh
        expr: histogram_quantile(0.95, sum by (route, method, le) (rate(http_response_time_seconds_bucket{route="/api/v1/vault/summary"}[5m]))) > 0.2
        for: 5m
        labels:
          severity: warning
          service: yieldvault-backend
        annotations:
          summary: "YieldVault summary latency budget exceeded"
          description: "The vault summary P95 latency is above its 200ms budget."

      - alert: YieldVaultCriticalWriteLatencyHigh
        expr: histogram_quantile(0.95, sum by (route, method, le) (rate(http_response_time_seconds_bucket{route=~"/api/v1/vault/(deposit|withdraw)"}[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
          service: yieldvault-backend
        annotations:
          summary: "YieldVault write latency budget exceeded"
          description: "A critical vault write endpoint has P95 latency above its 500ms budget."

      - alert: YieldVaultCriticalEndpointErrorBudgetBurn
        expr: |
          sum by (route) (rate(http_request_error_total{status_class="5xx",route=~"/health|/ready|/api/v1/vault/(summary|deposit|withdraw)"}[5m]))
          /
          sum by (route) (rate(http_request_count{route=~"/health|/ready|/api/v1/vault/(summary|deposit|withdraw)"}[5m]))
          > 0.01
        for: 5m
        labels:
          severity: critical
          service: yieldvault-backend
        annotations:
          summary: "YieldVault critical endpoint error budget is burning"
          description: "5xx responses exceed 1% of traffic for {{ $labels.route }} over the last 5 minutes."

      - alert: YieldVaultExternalDependencyLatencyHigh
        expr: histogram_quantile(0.95, sum by (dependency, operation, le) (rate(external_dependency_latency_seconds_bucket{outcome="success"}[5m]))) > 2
        for: 5m
        labels:
          severity: warning
          service: yieldvault-backend
        annotations:
          summary: "YieldVault external dependency is slow"
          description: "P95 {{ $labels.dependency }} {{ $labels.operation }} latency is above 2 seconds."
          runbook_url: "https://github.com/Junirezz/YieldVault-RWA/blob/main/backend/docs/PROMETHEUS_ALERTS_RUNBOOK.md#database-and-dependencies"

      - alert: YieldVaultBackgroundJobUnhealthy
        expr: job_health_status == 0
        for: 5m
        labels:
          severity: critical
          service: yieldvault-backend
        annotations:
          summary: "YieldVault background job is unhealthy"
          description: "Job {{ $labels.job_name }} is reporting degraded health."
          runbook_url: "https://github.com/Junirezz/YieldVault-RWA/blob/main/backend/docs/PROMETHEUS_ALERTS_RUNBOOK.md#background-jobs"

      - alert: YieldVaultJobDeadLettersPresent
        expr: job_dead_letter_count > 0
        for: 5m
        labels:
          severity: warning
          service: yieldvault-backend
        annotations:
          summary: "YieldVault background job has dead letters"
          description: "Job {{ $labels.job_name }} has {{ $value }} dead-letter records."
          runbook_url: "https://github.com/Junirezz/YieldVault-RWA/blob/main/backend/docs/PROMETHEUS_ALERTS_RUNBOOK.md#background-jobs"

      - alert: YieldVaultDatabaseBackupUnhealthy
        expr: job_health_status{job_name="databaseBackup"} == 0 or job_dead_letter_count{job_name="databaseBackup"} > 0
        for: 5m
        labels:
          severity: critical
          service: yieldvault-backend
        annotations:
          summary: "YieldVault database backup job is unhealthy"
          description: "The scheduled database backup job is reporting degraded health."
          runbook_url: "https://github.com/Junirezz/YieldVault-RWA/blob/main/backend/docs/PROMETHEUS_ALERTS_RUNBOOK.md#database-backups"

      - alert: YieldVaultEventOutboxLagHigh
        expr: event_outbox_oldest_pending_age_seconds > 60 or event_outbox_pending_count > 100
        for: 5m
        labels:
          severity: warning
          service: yieldvault-backend
        annotations:
          summary: "YieldVault event outbox is lagging"
          description: "Outbox events are older than 60 seconds or more than 100 events are awaiting relay."
          runbook_url: "https://github.com/Junirezz/YieldVault-RWA/blob/main/backend/docs/PROMETHEUS_ALERTS_RUNBOOK.md#webhooks-and-event-outbox"

      - alert: YieldVaultEmailQueueLagHigh
        expr: email_queue_oldest_pending_age_seconds > 300 or email_queue_pending_count > 100
        for: 5m
        labels:
          severity: warning
          service: yieldvault-backend
        annotations:
          summary: "YieldVault email queue is lagging"
          description: "Queued email is older than 5 minutes or more than 100 emails are awaiting delivery."
          runbook_url: "https://github.com/Junirezz/YieldVault-RWA/blob/main/backend/docs/PROMETHEUS_ALERTS_RUNBOOK.md#email-queue"

      - alert: YieldVaultWebhookDeliveryBacklog
        expr: webhook_delivery_failed_count > 0 or webhook_delivery_pending_count > 100
        for: 5m
        labels:
          severity: warning
          service: yieldvault-backend
        annotations:
          summary: "YieldVault webhook deliveries are failing or backlogged"
          description: "Webhook deliveries have failures or more than 100 pending deliveries."
          runbook_url: "https://github.com/Junirezz/YieldVault-RWA/blob/main/backend/docs/PROMETHEUS_ALERTS_RUNBOOK.md#webhooks-and-event-outbox"

      - alert: YieldVaultDatabaseQueryLatencyHigh
        expr: histogram_quantile(0.95, sum by (model, action, le) (rate(db_query_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
          service: yieldvault-backend
        annotations:
          summary: "YieldVault database query latency is high"
          description: "P95 {{ $labels.model }}.{{ $labels.action }} query latency is above the 1-second SLO."
          runbook_url: "https://github.com/Junirezz/YieldVault-RWA/blob/main/backend/docs/PROMETHEUS_ALERTS_RUNBOOK.md#database-and-dependencies"

      - alert: YieldVaultDatabaseQueryBudgetBreaches
        expr: sum(rate(db_query_budget_breach_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
          service: yieldvault-backend
        annotations:
          summary: "YieldVault database query budgets are being exceeded"
          description: "Database query budget breaches continue to occur."
          runbook_url: "https://github.com/Junirezz/YieldVault-RWA/blob/main/backend/docs/PROMETHEUS_ALERTS_RUNBOOK.md#database-and-dependencies"