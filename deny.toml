# cargo-deny configuration for supply-chain security checks (CI: rust-security.yml).
#
# Advisories, bans, licenses, and sources checks are run in CI. Entries below are ignored
# only after triage; see contracts/.false-positives.md for the rationale and
# docs/FALSE_POSITIVE_HANDLING.md for the process.
[advisories]
ignore = [
    # Review date: 2026-10-17; Rationale & policy: docs/FALSE_POSITIVE_HANDLING.md
    "RUSTSEC-2026-0097", # rand: unsound only with log+thread_rng+custom logger; not used here
    # Review date: 2026-10-17; Rationale & policy: docs/FALSE_POSITIVE_HANDLING.md
    "RUSTSEC-2024-0388", # derivative: unmaintained (informational), no known exploit
    # Review date: 2026-10-17; Rationale & policy: docs/FALSE_POSITIVE_HANDLING.md
    "RUSTSEC-2024-0436", # paste: unmaintained (informational), no known exploit
]

[licenses]
version = 2
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
